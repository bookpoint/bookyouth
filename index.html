<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년 책사줄게 - 서점 잔액 & 위치 조회</title>
    <!-- 카카오맵 API -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1c9c405c6220a2a05886c680d8690e6a"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        header { background: #007bff; color: white; padding: 15px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 20px; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        .search-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-container select { width: 35%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background-color: #fff; }
        .search-container input { width: 65%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        
        #map { width: 100%; height: 320px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ccc; background-color: #e9ecef; }
        
        .store-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-left: 5px solid #007bff; }
        .store-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .store-title { font-size: 18px; font-weight: bold; color: #333; margin: 0; }
        .store-city { font-size: 12px; background: #e9ecef; padding: 3px 8px; border-radius: 4px; color: #495057; margin-left: 6px; }
        .store-address { font-size: 13px; color: #666; margin-bottom: 10px; }
        .store-balance { font-size: 16px; font-weight: bold; color: #28a745; background: #e8f5e9; padding: 4px 10px; border-radius: 20px; }
        .store-policy { font-size: 14px; color: #555; white-space: pre-wrap; line-height: 1.5; background: #f8f9fa; padding: 10px; border-radius: 6px; }
        .no-data { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>

<header>
    <h1>📚 청소년 책사줄게 - 서점 실시간 잔액 안내</h1>
</header>

<div class="container">
    <div class="search-container">
        <select id="cityFilter">
            <option value="전체">전체 시/군</option>
            <option value="가평군">가평군</option><option value="고양시">고양시</option><option value="과천시">과천시</option>
            <option value="광명시">광명시</option><option value="광주시">광주시</option><option value="구리시">구리시</option>
            <option value="군포시">군포시</option><option value="김포시">김포시</option><option value="남양주시">남양주시</option>
            <option value="동두천시">동두천시</option><option value="부천시">부천시</option><option value="성남시">성남시</option>
            <option value="수원시">수원시</option><option value="시흥시">시흥시</option><option value="안산시">안산시</option>
            <option value="안성시">안성시</option><option value="안양시">안양시</option><option value="양주시">양주시</option>
            <option value="양평군">양평군</option><option value="여주시">여주시</option><option value="연천군">연천군</option>
            <option value="오산시">오산시</option><option value="용인시">용인시</option><option value="의왕시">의왕시</option>
            <option value="의정부시">의정부시</option><option value="이천시">이천시</option><option value="파주시">파주시</option>
            <option value="평택시">평택시</option><option value="포천시">포천시</option><option value="하남시">하남시</option>
            <option value="화성시">화성시</option>
        </select>
        <input type="text" id="searchInput" placeholder="🔍 서점명 또는 상세주소 검색">
    </div>

    <div id="map"></div>

    <div id="storeList">
        <div class="no-data">등록된 서점 정보를 불러오는 중입니다...</div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMQPApA3XeE08uEMKnb-qJnDeWfP9OpM",
    authDomain: "bookyouth.firebaseapp.com",
    databaseURL: "https://bookyouth-default-rtdb.firebaseio.com",
    projectId: "bookyouth",
    storageBucket: "bookyouth.firebasestorage.app",
    messagingSenderId: "1089377339474",
    appId: "1:1089377339474:web:1a300744b0f0b210aab78b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let allStores = {};
  let map = null;
  let markers = [];

  function initMap() {
      const container = document.getElementById('map');
      const options = {
          center: new kakao.maps.LatLng(37.2635727, 127.0286009),
          level: 8
      };
      map = new kakao.maps.Map(container, options);
  }

  const storesRef = ref(db, 'stores');
  onValue(storesRef, (snapshot) => {
      allStores = snapshot.val() || {};
      filterStores();
  });

  window.filterStores = function() {
      const selectedCity = document.getElementById('cityFilter').value;
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = {};

      for (let name in allStores) {
          const item = allStores[name];
          const cityMatch = (selectedCity === "전체") || (item.city === selectedCity);
          const textMatch = name.toLowerCase().includes(query) || (item.address && item.address.toLowerCase().includes(query));

          if (cityMatch && textMatch) {
              filtered[name] = item;
          }
      }
      renderStores(filtered);
  }

  document.getElementById('cityFilter').addEventListener('change', filterStores);
  document.getElementById('searchInput').addEventListener('keyup', filterStores);

  window.renderStores = function(stores) {
      const storeList = document.getElementById('storeList');
      storeList.innerHTML = '';

      // 기존 마커 지우기
      markers.forEach(m => m.setMap(null));
      markers = [];

      if (Object.keys(stores).length === 0) {
          storeList.innerHTML = '<div class="no-data">조건에 부합하는 서점이 없습니다.</div>';
          return;
      }

      let lastCoords = null;

      for (let name in stores) {
          const item = stores[name];
          
          const card = document.createElement('div');
          card.className = 'store-card';
          card.innerHTML = `
              <div class="store-header">
                  <div>
                      <span class="store-title">📖 ${name}</span>
                      <span class="store-city">${item.city || '경기도'}</span>
                  </div>
                  <span class="store-balance">잔액: ${Number(item.balance).toLocaleString()}원</span>
              </div>
              <div class="store-address">📍 ${item.address || '주소 정보 없음'}</div>
              <div class="store-policy"><strong>운영 정책:</strong><br>${item.policy || '등록된 정책이 없습니다.'}</div>
          `;
          storeList.appendChild(card);

          // DB에 저장된 lat, lng로 바로 핀 그리기
          if (map && item.lat && item.lng) {
              const coords = new kakao.maps.LatLng(item.lat, item.lng);
              const marker = new kakao.maps.Marker({
                  map: map,
                  position: coords
              });
              markers.push(marker);
              lastCoords = coords;
          }
      }

      // 검색된 서점이 있으면 지도 중심 이동
      if (map && lastCoords) {
          map.setCenter(lastCoords);
      }
  }

  window.addEventListener('load', () => {
      initMap();
  });
</script>

</body>
</html>
