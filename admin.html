<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년 책사줄게 - 서점 관리자 시스템</title>
    <!-- 카카오 지도 API -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1c9c405c6220a2a05886c680d8690e6a&libraries=services"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #007bff; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-save { flex: 2; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-delete { flex: 1; padding: 12px; background-color: #dc3545; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-save:hover { background-color: #0056b3; }
        .btn-delete:hover { background-color: #bd2130; }
        
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; }
        .preview-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; }
        .preview-title { font-weight: bold; margin-bottom: 8px; color: #495057; }
        .coords-badge { display: inline-block; background: #6c757d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-top: 5px; }
        .hint-text { font-size: 12px; color: #6c757d; margin-top: 4px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>📑 서점 정보 & 기부금 관리</h2>
    
    <div class="form-group">
        <label for="selectStore">관리할 서점 선택</label>
        <select id="selectStore">
            <option value="">-- 직접 입력 또는 선택 --</option>
        </select>
    </div>

    <div class="form-group">
        <label for="citySelect">지역 (경기도 시/군)</label>
        <select id="citySelect">
            <option value="가평군">가평군</option><option value="고양시">고양시</option><option value="과천시">과천시</option>
            <option value="광명시">광명시</option><option value="광주시" selected>광주시</option><option value="구리시">구리시</option>
            <option value="군포시">군포시</option><option value="김포시">김포시</option><option value="남양주시">남양주시</option>
            <option value="동두천시">동두천시</option><option value="부천시">부천시</option><option value="성남시">성남시</option>
            <option value="수원시">수원시</option><option value="시흥시">시흥시</option><option value="안산시">안산시</option>
            <option value="안성시">안성시</option><option value="안양시">안양시</option><option value="양주시">양주시</option>
            <option value="양평군">양평군</option><option value="여주시">여주시</option><option value="연천군">연천군</option>
            <option value="오산시">오산시</option><option value="용인시">용인시</option><option value="의왕시">의왕시</option>
            <option value="의정부시">의정부시</option><option value="이천시">이천시</option><option value="파주시">파주시</option>
            <option value="평택시">평택시</option><option value="포천시">포천시</option><option value="하남시">하남시</option>
            <option value="화성시">화성시</option>
        </select>
    </div>

    <div class="form-group">
        <label for="storeName">서점 이름</label>
        <input type="text" id="storeName" placeholder="예: 서행구간">
    </div>

    <div class="form-group">
        <label for="storeAddress">서점 도로명 주소 (지도 표시용)</label>
        <input type="text" id="storeAddress" placeholder="예: 경기 광주시 퇴촌면 천진암로 596 1층">
        <div class="hint-text">* '1층', '101호' 등이 들어가 있어도 자동으로 정제하여 좌표를 추출합니다.</div>
    </div>

    <div class="form-group">
        <label for="storeBalance">현재 기부금 잔액 (원)</label>
        <input type="number" id="storeBalance" placeholder="500000">
    </div>

    <div class="form-group">
        <label for="storePolicy">서점 운영 정책</label>
        <textarea id="storePolicy" rows="4" placeholder="운영 정책 내용을 입력하세요."></textarea>
    </div>

    <div class="btn-group">
        <button id="saveBtn" class="btn-save">정보 저장 / 수정</button>
        <button id="deleteBtn" class="btn-delete">서점 삭제</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div class="preview-box">
        <div class="preview-title">📍 선택 서점 정보 & 지도 좌표 미리보기</div>
        <div id="coordsPreview">주소를 입력하거나 서점을 선택하면 카카오 지도 좌표가 표시됩니다.</div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCMQPApA3XeE08uEMKnb-qJnDeWfP9OpM",
    authDomain: "bookyouth.firebaseapp.com",
    databaseURL: "https://bookyouth-default-rtdb.firebaseio.com",
    projectId: "bookyouth",
    storageBucket: "bookyouth.firebasestorage.app",
    messagingSenderId: "1089377339474",
    appId: "1:1089377339474:web:1a300744b0f0b210aab78b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let allStores = {};

  // DB 실시간 동기화
  const storesRef = ref(db, 'stores');
  onValue(storesRef, (snapshot) => {
      allStores = snapshot.val() || {};
      const selectStore = document.getElementById('selectStore');
      selectStore.innerHTML = '<option value="">-- 직접 입력 또는 선택 --</option>';

      for (let name in allStores) {
          const item = allStores[name];
          const option = document.createElement('option');
          option.value = name;
          option.textContent = `[${item.city || '경기'}] ${name}`;
          selectStore.appendChild(option);
      }
  });

  // 서점 선택 시 데이터 자동채우기
  document.getElementById('selectStore').addEventListener('change', (e) => {
      const selectedName = e.target.value;
      if (selectedName && allStores[selectedName]) {
          const item = allStores[selectedName];
          document.getElementById('citySelect').value = item.city || '광주시';
          document.getElementById('storeName').value = selectedName;
          document.getElementById('storeAddress').value = item.address || '';
          document.getElementById('storeBalance').value = item.balance || 0;
          document.getElementById('storePolicy').value = item.policy || '';

          if (item.lat && item.lng) {
              document.getElementById('coordsPreview').innerHTML = `
                  <strong>${selectedName}</strong><br>
                  <span class="coords-badge">위도(lat): ${item.lat}</span> 
                  <span class="coords-badge">경도(lng): ${item.lng}</span>
              `;
          } else {
              document.getElementById('coordsPreview').innerHTML = `⚠️ 저장된 좌표가 없습니다. [정보 저장 / 수정]을 눌러 좌표를 추출해 주세요.`;
          }
      }
  });

  // 주소에서 '1층', '2층', '101호' 등 건물 상세정보 자동 제거 함수
  function cleanAddress(rawAddr) {
      return rawAddr
          .replace(/\(.*\)/g, '') // 괄호 항목 제거
          .replace(/\b\d+층\b/g, '') // '1층', '2층' 등 제거
          .replace(/\b\d+호\b/g, '') // '101호' 등 제거
          .replace(/지하\d+층/g, '') // '지하1층' 등 제거
          .replace(/\s+/g, ' ') // 다중 공백 단일화
          .trim();
  }

  // 저장 버튼 클릭 이벤트
  document.getElementById('saveBtn').addEventListener('click', () => {
      const city = document.getElementById('citySelect').value;
      const name = document.getElementById('storeName').value.trim();
      const address = document.getElementById('storeAddress').value.trim();
      const balance = document.getElementById('storeBalance').value;
      const policy = document.getElementById('storePolicy').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!name || !address || !balance) {
          alert('서점 이름, 주소, 잔액은 필수 입력사항입니다.');
          return;
      }

      statusMsg.style.color = "blue";
      statusMsg.innerText = "좌표 검색 중...";

      // 카카오 지도가 정상 로드되었을 경우 카카오 API 사용
      if (window.kakao && window.kakao.maps && window.kakao.maps.services) {
          const geocoder = new kakao.maps.services.Geocoder();
          const searchAddr = cleanAddress(address); // 정제된 주소로 검색

          geocoder.addressSearch(searchAddr, function(result, status) {
              let lat = 37.4082; // 광주시 기본 위치
              let lng = 127.2582;

              if (status === kakao.maps.services.Status.OK) {
                  lat = parseFloat(result[0].y);
                  lng = parseFloat(result[0].x);
              } else {
                  console.warn("카카오 지도 주소 검색 실패, 시/군 기준 기본 좌표 적용:", status);
              }

              saveToFirebase(name, city, address, balance, policy, lat, lng);
          });
      } else {
          // 카카오 지도를 불러오지 못하더라도 저장 동작은 정상 완료 처리 (기본 광주시 좌표 적용)
          saveToFirebase(name, city, address, balance, policy, 37.4082, 127.2582);
      }
  });

  // 파이어베이스 저장 함수
  function saveToFirebase(name, city, address, balance, policy, lat, lng) {
      const statusMsg = document.getElementById('statusMsg');
      
      set(ref(db, 'stores/' + name), {
          city: city,
          address: address,
          balance: Number(balance),
          policy: policy,
          lat: lat,
          lng: lng
      }).then(() => {
          statusMsg.style.color = "green";
          statusMsg.innerText = `✅ "${name}" 저장 완료!`;
          document.getElementById('coordsPreview').innerHTML = `
              <strong>${name} 정보 저장 성공!</strong><br>
              <span class="coords-badge">위도(lat): ${lat}</span> 
              <span class="coords-badge">경도(lng): ${lng}</span>
          `;
      }).catch((error) => {
          statusMsg.style.color = "red";
          statusMsg.innerText = "❌ 저장 실패: " + error.message;
      });
  }

  // 삭제 버튼 클릭 이벤트
  document.getElementById('deleteBtn').addEventListener('click', () => {
      const name = document.getElementById('storeName').value.trim();
      if (!name) {
          alert('삭제할 서점을 선택하거나 이름을 입력해 주세요.');
          return;
      }

      if (confirm(`정말로 "${name}" 서점을 삭제하시겠습니까?`)) {
          remove(ref(db, 'stores/' + name)).then(() => {
              alert(`"${name}" 서점이 삭제되었습니다.`);
              location.reload();
          });
      }
  });
</script>

</body>
</html>
